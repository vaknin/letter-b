<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The letter B b – English, 3rd grade</title>
<style>
:root{
  --ink:#2b2340; --bg:#fff7e8; --card:#ffffff; --purple:#7357ff; --purple-d:#4f37c9;
  --pink:#ff5fa2; --yellow:#ffd23f; --green:#22b573; --green-d:#178a56; --red:#e8202a;
  --blue:#2f80ed; --sky:#c9ecff; --muted:#6f6a86; --nb:#5b6b8c;
  --font:"Fredoka","Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --he:"Rubik","Assistant","Heebo","Segoe UI",Arial,sans-serif;
  --topH:clamp(54px,8.5vh,78px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12% 18%,#ffe6b3 0 3px,transparent 4px),radial-gradient(circle at 70% 60%,#ffd9ec 0 3px,transparent 4px);
  background-size:90px 90px,130px 130px;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.b{color:var(--red)}
.nb{color:var(--nb)}

/* ---------- top bar ---------- */
#top{height:var(--topH);flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;box-shadow:0 3px 0 #f0e4cc}
#stageTitle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;font-weight:800;font-size:clamp(18px,3vh,30px);white-space:nowrap}
#stNum{flex:none;display:grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .3em;border-radius:999px;background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
#stName{overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;font-size:.6em;font-weight:800;padding:.35em .8em;border-radius:999px;background:#f2eefe;color:var(--purple-d);letter-spacing:.04em}
.chip.off{background:#e6f6ee;color:var(--green-d)}
.tb-right{display:flex;gap:10px;flex:none}
.ib{width:calc(var(--topH) - 16px);height:calc(var(--topH) - 16px);border-radius:18px;border:0;background:#f4f0ff;display:grid;place-items:center;box-shadow:0 4px 0 #ddd3ff;transition:transform .1s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #ddd3ff}
.ib svg{width:58%;height:58%}
#progress{flex:none;display:flex;gap:4px;padding:8px 14px 0}
#progress button{flex:1;height:12px;border:0;border-radius:99px;background:#eadfca;padding:0;transition:transform .2s,background .2s}
#progress button.off{background:#e3eadf}
#progress button.done{background:#b9a8ff}
#progress button.done.off{background:#9fdcbc}
#progress button.cur{background:var(--purple);transform:scaleY(1.6)}
#progress button.bonus{flex:.6;background:repeating-linear-gradient(45deg,#ffe08a 0 6px,#fff2c2 6px 12px)}
#progress button.bonus.cur{background:var(--yellow)}

/* ---------- screen ---------- */
#screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 18px 34px;gap:12px}
#keys{position:fixed;right:12px;bottom:6px;font-size:13px;color:#a59fb8;font-weight:700;pointer-events:none;white-space:nowrap}
.he{direction:rtl;font-family:var(--he);font-weight:700;font-size:clamp(20px,3.6vmin,40px);margin:0;padding:.35em 1.1em;background:#fff;border-radius:999px;box-shadow:0 4px 0 #f0e4cc;text-align:center;max-width:96%;flex:none}
.title{font-weight:900;font-size:clamp(40px,9vmin,120px);margin:0;line-height:1.05;text-align:center}
.sub{font-weight:800;font-size:clamp(24px,4.5vmin,56px);margin:0;text-align:center}
.word-line{min-height:1.2em;font-size:clamp(54px,12vmin,150px);display:flex;align-items:center;justify-content:center}
.word{font-weight:900;line-height:1.1;letter-spacing:.02em;visibility:hidden}
.word.show{visibility:visible;animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}
.card{background:var(--card);border-radius:34px;box-shadow:0 8px 0 #eedfc3,0 14px 40px rgba(80,50,0,.08);position:relative}
.pic{display:grid;place-items:center}
.pic svg{width:100%;height:100%}
.pop-in{animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
.floaty{animation:floaty 3.5s ease-in-out infinite}
.btn{border:0;border-radius:24px;padding:.45em 1.2em;font-weight:900;font-size:clamp(22px,4vmin,44px);background:var(--purple);color:#fff;box-shadow:0 7px 0 var(--purple-d);display:inline-flex;align-items:center;gap:.4em;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--purple-d)}
.btn svg{width:1em;height:1em}
.btn.green{background:var(--green);box-shadow:0 7px 0 var(--green-d)}
.side{position:absolute;top:50%;transform:translateY(-50%);width:clamp(46px,7vmin,76px);height:clamp(46px,7vmin,76px);border-radius:50%;border:0;background:#fff;box-shadow:0 5px 0 #eadfca;display:grid;place-items:center;z-index:3}
.side svg{width:55%;height:55%}
.side:active{transform:translateY(-46%)}
.side.l{left:10px}.side.r{right:10px}
.dots{display:flex;gap:10px;flex:none}
.dots i{width:14px;height:14px;border-radius:50%;background:#e8dcc4;transition:all .2s}
.dots i.on{background:var(--purple);transform:scale(1.35)}
.dots i.ok{background:var(--green)}
.counter{font-weight:900;font-size:clamp(18px,3vmin,30px);color:var(--muted)}
.parts{order:-1;flex:none;display:flex;gap:8px;z-index:4;white-space:nowrap;background:#fff;padding:6px;border-radius:999px;box-shadow:0 4px 0 #f0e4cc}
.parts button{border:0;border-radius:999px;padding:.35em 1em;font-weight:800;font-size:clamp(14px,2.2vmin,22px);background:transparent;color:var(--muted)}
.parts button.on{background:var(--purple);color:#fff}


/* overlays */
.win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,247,232,.82);z-index:20;animation:fadeIn .3s}
.win-card{background:#fff;border-radius:40px;padding:4vmin 7vmin;text-align:center;box-shadow:0 10px 0 #eedfc3;animation:popIn .5s cubic-bezier(.3,1.6,.5,1);max-width:92%}
.win-card h2{font-size:clamp(40px,9vmin,110px);margin:.1em 0;font-weight:900;color:var(--purple)}
.win-card p{font-size:clamp(22px,4.5vmin,52px);margin:.2em 0 0;font-weight:800}
.win-stars{display:flex;justify-content:center;gap:2vmin}
.win-stars svg{width:clamp(44px,9vmin,100px);height:auto;animation:spinPop .7s cubic-bezier(.3,1.6,.5,1) both}
.win-stars svg:nth-child(2){animation-delay:.12s;transform:translateY(-12%)}
.win-stars svg:nth-child(3){animation-delay:.24s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}

/* menu */
#menu{position:fixed;inset:0;background:rgba(43,35,64,.55);z-index:60;display:grid;place-items:center;padding:16px}
#menu[hidden]{display:none}
.menu-card{background:var(--bg);border-radius:32px;padding:22px;width:min(1180px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 0 #d9c8a8}
.menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.menu-head h2{margin:0;font-size:clamp(26px,4vmin,44px)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mstage{border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 #eadfca;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;transition:transform .1s}
.mstage:active{transform:translateY(4px)}
.mstage .n{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--purple);color:#fff;font-weight:900;font-size:22px}
.mstage.off .n{background:var(--green)}
.mstage.bonus .n{background:var(--yellow);color:var(--ink)}
.mstage.cur{outline:4px solid var(--purple)}
.mstage b{display:block;font-size:18px;line-height:1.15}
.mstage small{font-weight:700;color:var(--muted);font-size:14px}
.menu-keys{margin-top:14px;font-weight:700;color:var(--muted);font-size:15px;line-height:1.6}
.kbd{display:inline-block;background:#fff;border-radius:8px;padding:0 .45em;box-shadow:0 2px 0 #e2d6bd;color:var(--ink);font-weight:800}

/* ---------- static cards ---------- */
.calm{display:flex;flex-direction:column;align-items:center;gap:3vmin}
.calm .pic.mid{width:min(34vh,52vw);height:min(34vh,52vw)}
.calm .title{color:var(--purple)}
.lead{display:flex;flex-direction:column;align-items:center;gap:2vmin;width:100%}
.bb-wrap{width:min(92vw,108vh);height:min(52vh,70vw)}
.bb-wrap svg{width:100%;height:100%}
.bb-wrap.bounce{animation:bounceBig .9s cubic-bezier(.3,1.5,.5,1)}
.today{font-size:clamp(34px,7.5vmin,96px);font-weight:900;margin:0;visibility:hidden;text-align:center}
.today.show{visibility:visible;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.gest-row{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4vmin}
.gest-row .gi{width:clamp(80px,15vmin,170px);aspect-ratio:1;background:#fff;border-radius:26px;padding:1.6vmin;box-shadow:0 5px 0 #eedfc3}
.gest-row .gi .pic{width:100%;height:100%}
.eyes{width:min(20vh,40vw)}
.bubbles-row{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
.bub{position:relative;background:#fff;border:5px solid var(--ink);border-radius:40px;padding:.4em 1em;font-weight:900;font-size:clamp(28px,6vmin,72px)}
.bub:after{content:"";position:absolute;bottom:-22px;left:44px;border:16px solid transparent;border-top:20px solid var(--ink)}
.bub:before{content:"";position:absolute;bottom:-14px;left:48px;border:12px solid transparent;border-top:16px solid #fff;z-index:1}
.bub.alt{background:#fff4c7}
.bub.alt:after{left:auto;right:44px}
.bub.alt:before{left:auto;right:48px;border-top-color:#fff4c7}
.blank{display:inline-block;min-width:3.2em;border-bottom:.08em solid currentColor;transform:translateY(-.08em)}

/* ---------- A meet ---------- */
.meet{width:min(86vw,120vh);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vmin 2vmin 1vmin}
.meet .pic-slot{flex:1;min-height:0;width:100%;display:grid;place-items:center;cursor:pointer}
.meet .pic.big{width:min(100%,52vh);max-height:100%;aspect-ratio:1}
.gest{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;background:#f4f0ff;border-radius:20px;padding:6px 12px 6px 6px;font-weight:800;color:var(--purple-d);font-size:clamp(14px,2.2vmin,22px)}
.gest svg{width:clamp(40px,7vmin,72px);height:auto}

/* ---------- B pop ---------- */
.g-pop{padding-bottom:20px}
.pop-hud{width:100%;display:flex;align-items:center;justify-content:center;gap:3vmin;flex:none}
.say-btn{width:clamp(70px,12vmin,120px);height:clamp(70px,12vmin,120px);border-radius:50%;border:0;background:var(--purple);box-shadow:0 7px 0 var(--purple-d);display:grid;place-items:center}
.say-btn svg{width:58%;height:58%}
.say-btn.talk{animation:pulse .8s ease-in-out 2}
.stars{display:flex;align-items:center;gap:.25em;font-weight:900;font-size:clamp(30px,6vmin,64px);background:#fff;border-radius:999px;padding:.1em .6em .1em .3em;box-shadow:0 5px 0 #eedfc3}
.stars .star-ic svg{width:1.1em;height:1.1em}
.stars .cnt.bump{animation:popIn .4s}
.stars span:last-child{color:var(--muted);font-size:.7em}
.sky{position:relative;flex:1;width:100%;min-height:0;overflow:hidden;border-radius:30px;background:linear-gradient(#a8e1ff,#e6f7ff 80%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.04)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:55%;height:160%;left:15%;top:-70%}
.cloud:after{width:40%;height:130%;left:48%;top:-45%}
.balloon{position:absolute;top:100%;width:min(13%,22vh);aspect-ratio:1/1.5;padding:0;border:0;background:none;animation:rise 18s linear infinite;touch-action:none}
.balloon.gone{visibility:hidden}
.bl-in{position:relative;width:100%;height:100%;animation:sway 3s ease-in-out infinite alternate}
.bl-in>svg{width:100%;height:100%}
.bl-pic{position:absolute;left:17%;top:9%;width:66%;aspect-ratio:1;background:#fff;border-radius:50%;border:4px solid var(--ink);padding:7%}
.bl-in.wobble{animation:wobble .5s}
.flash{position:absolute;left:0;right:0;top:45%;display:none;justify-content:center;pointer-events:none;z-index:5}
.flash.show{display:flex}
.flash .word{visibility:visible;background:#fff;border-radius:30px;padding:0 .4em;box-shadow:0 8px 0 #eedfc3;font-size:clamp(60px,13vmin,150px);animation:popIn .35s cubic-bezier(.3,1.6,.5,1)}

/* ---------- C, D, I, J, K shared slide ---------- */
.slide{flex:1;min-height:0;width:min(88vw,130vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;padding:2vmin}
.slide .pic.big{flex:1;min-height:0;max-height:50vh;width:100%;}
.slide .pic.big svg{width:auto;height:100%;max-width:100%}
.verdict{position:absolute;top:4%;right:4%;font-weight:900;font-size:clamp(40px,10vmin,130px);padding:.05em .45em;border-radius:28px;transform:rotate(8deg);animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
.verdict.yes{background:var(--green);color:#fff;box-shadow:0 8px 0 var(--green-d)}
.verdict.no{background:#e9edf5;color:var(--nb);box-shadow:0 8px 0 #cfd6e4;font-size:clamp(30px,7vmin,90px)}
.mark{position:absolute;top:3%;right:3%;width:clamp(90px,20vmin,220px);animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
.thumbs-hint{display:flex;gap:2vmin;align-items:center}
.thumbs-hint svg{width:clamp(48px,11vmin,120px);height:auto}

/* ---------- D hot potato ---------- */
.hp-center{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.hp-center>div{display:flex;flex-direction:column;align-items:center;gap:2vmin;height:100%;justify-content:center}
.hp-center .pic.mid{width:min(30vh,40vw);aspect-ratio:1}
.hp-center .pic.huge{height:min(56vh,80vw);aspect-ratio:1}
.spin{animation:spinBall 1.1s linear infinite}
.notes{display:flex;gap:4vmin}
.notes svg{width:clamp(40px,8vmin,90px);height:auto;animation:hop .55s ease-in-out infinite alternate}
.notes svg:nth-child(2){animation-delay:.18s}.notes svg:nth-child(3){animation-delay:.36s}
.shake{animation:shake .25s linear infinite}
.drum-title{font-size:clamp(70px,16vmin,200px);font-weight:900;color:var(--pink)}

/* ---------- E letter ---------- */
.letters{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:4vmin;width:100%}
.letters .lbox{height:min(60vh,44vw);aspect-ratio:240/280;background:#fff;border-radius:34px;box-shadow:0 8px 0 #eedfc3;padding:2vmin}
.letters svg{width:100%;height:100%}
.lo{fill:none;stroke:var(--ink);stroke-width:44;stroke-linecap:round;stroke-linejoin:round}
.lc{fill:none;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.lg{fill:none;stroke:#ece7f7;stroke-width:38;stroke-linecap:round;stroke-linejoin:round}
.la{fill:none;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.badge{opacity:0;transition:opacity .2s}
.badge.on{opacity:1}
.badge circle{stroke:#fff;stroke-width:4}
.badge text{font:900 22px var(--font);fill:#fff;text-anchor:middle;dominant-baseline:central}
.ah{opacity:0}
.ah.on{opacity:1}
.cards6{flex:1;min-height:0;width:min(96vw,150vh);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2vmin}
.wcard{border:0;background:#fff;border-radius:28px;box-shadow:0 6px 0 #eedfc3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4vmin;min-height:0;transition:transform .12s}
.wcard:active{transform:translateY(4px)}
.wcard .pic{flex:1;min-height:0;width:100%}
.wcard .pic svg{width:auto;height:100%;max-width:100%}
.wcard .w{font-weight:900;font-size:clamp(24px,5.5vmin,64px);line-height:1.15}
.wcard.bounce{animation:bounceBig .6s}

/* ---------- F catch ---------- */
.catch-hud{width:100%;display:flex;align-items:center;gap:3vmin;flex:none}
.tbar{flex:1;height:22px;border-radius:99px;background:#eadfca;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow));border-radius:99px}
.pill{border:0;border-radius:999px;padding:.3em 1em;font-weight:800;font-size:clamp(16px,2.6vmin,26px);background:#fff;box-shadow:0 4px 0 #eedfc3}
.field{position:relative;flex:1;width:100%;min-height:0;overflow:hidden;border-radius:30px;background:linear-gradient(#fff,#fff4dc);box-shadow:inset 0 0 0 4px #f3e6cb}
.letter{position:absolute;top:0;left:0;border:0;background:none;padding:0;width:clamp(80px,15vmin,170px);height:clamp(80px,15vmin,170px);touch-action:none}
.letter .lt{width:100%;height:100%;display:grid;place-items:center;font-weight:900;font-size:clamp(70px,14vmin,160px);line-height:1;border-radius:30px;background:rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(0,0,0,.06)}
.letter .lt svg{width:90%;height:90%}
.letter.burst .lt{background:none;box-shadow:none;animation:burst .6s forwards}
.letter.bad .lt{color:#b9b5c6 !important;animation:shake .3s 2,fallAway .9s .5s forwards}
.letter.fade .lt{animation:fadeOut .5s forwards}
.ready{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin}
.ready .big{font-weight:900;font-size:clamp(80px,22vmin,260px);line-height:1}

/* ---------- G build ---------- */
.build{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;width:100%}
.build .pic{height:min(24vh,42vw);aspect-ratio:1;cursor:pointer;flex:none}
.bword{--n:3;display:flex;align-items:center;justify-content:center;gap:.06em;font-weight:900;font-size:min(clamp(56px,12vmin,150px),calc(86vw / (var(--n) * .8)));line-height:1;padding:.1em .3em .14em;border-radius:30px;min-height:1.4em;flex:none;transition:background .3s,box-shadow .3s}
.bword.glow{background:#fff;box-shadow:0 0 0 8px #ffe77a,0 0 60px 18px rgba(255,210,63,.75);animation:popIn .5s}
.bword .w{letter-spacing:.02em}
.slot{width:.68em;height:1.12em;border:.06em dashed #b6a9e8;border-radius:.16em;display:grid;place-items:center;background:#f6f3ff}
.slot.first{border-color:var(--red);background:#fff1f1}
.slot.filled{border-style:solid;border-color:transparent;background:#fff}
.slot.next{box-shadow:0 0 0 .05em #ffd23f}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.4vmin,24px);max-width:min(96vw,1100px);flex:none}
.tile{width:clamp(64px,12vmin,130px);height:clamp(64px,12vmin,130px);border:0;border-radius:24px;background:#fff;box-shadow:0 7px 0 #d7cbf7;font-weight:900;font-size:clamp(44px,8.5vmin,96px);line-height:1;color:var(--purple-d);touch-action:none;position:relative;z-index:2}
.tile.drag{z-index:10;box-shadow:0 16px 24px rgba(0,0,0,.15);transition:none}
.tile.shake{animation:shake .3s 2}
.tile.used{visibility:hidden}
.bfoot{display:flex;align-items:center;justify-content:center;gap:4vmin;flex:none}
.nextbtn{visibility:hidden}
.nextbtn.show{visibility:visible;animation:popIn .4s}

/* ---------- I its a ---------- */
.itsa{flex:1;min-height:0;width:min(96vw,150vh);display:flex;align-items:center;justify-content:center;gap:4vmin}
.itsa .pic{height:min(50vh,40vw);aspect-ratio:1;flex:none}
.bubbles{display:flex;flex-direction:column;gap:5vmin;align-items:flex-start}
.bubble{position:relative;background:#fff;border:5px dashed #cfc6e6;border-radius:44px;min-width:min(42vw,560px);min-height:1.6em;padding:.25em .8em;font-weight:900;font-size:clamp(32px,7vmin,88px);transition:all .25s}
.bubble span{visibility:hidden}
.bubble.on{border-style:solid;border-color:var(--ink);animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
.bubble.on span{visibility:visible}
.bubble.q.on{background:#efeaff}
.bubble.a.on{background:#fff4c7}
.bubble:after{content:"";position:absolute;left:-26px;top:50%;margin-top:-14px;border:14px solid transparent;border-right:24px solid #cfc6e6;border-left:0}
.bubble.on:after{border-right-color:var(--ink)}
.hint{font-size:clamp(20px,3.4vmin,36px);font-weight:800;color:var(--muted);background:#fff;border-radius:999px;padding:.2em .8em}
.hint span{font-family:var(--he)}

/* ---------- J ---------- */
.sent{font-weight:800;font-size:clamp(26px,5vmin,60px);color:var(--muted);min-height:1.3em;text-align:center}
.sent.fix{color:var(--green-d);animation:popIn .4s}

/* ---------- L read ---------- */
.read{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;width:100%}
.read .pic{height:min(40vh,56vw);aspect-ratio:1}
.chips{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.wchip{border:0;border-radius:28px;background:#fff;box-shadow:0 8px 0 #e2d8f7;font-weight:900;font-size:clamp(48px,11vmin,130px);padding:.05em .45em;line-height:1.2;transition:transform .2s,background .2s}
.wchip.k{background:var(--yellow);transform:translateY(-8px) scale(1.08);box-shadow:0 8px 0 #e0b21f}
.wchip.wobble{animation:wobble .5s}
.wchip.right .b{text-shadow:0 0 18px rgba(232,32,42,.7),0 0 4px rgba(232,32,42,.9)}
.wchip.right{background:#fff3f3;box-shadow:0 0 0 6px #ffb3b6,0 8px 0 #f0c4c6;animation:popIn .45s}

/* ---------- M / N support ---------- */
.frame{font-weight:900;font-size:clamp(46px,11vmin,140px);background:#fff;border:8px dashed var(--purple);border-radius:36px;padding:.12em .6em}
.bank{width:min(96vw,170vh);display:grid;grid-template-columns:repeat(6,1fr);gap:1.6vmin;flex:1;min-height:0;max-height:34vh}
.bank .wcard .w{font-size:clamp(18px,3.8vmin,44px)}
.timer{position:absolute;top:12px;right:16px;font-weight:900;font-size:clamp(24px,5vmin,54px);background:#fff;border-radius:999px;padding:.05em .6em;box-shadow:0 5px 0 #eedfc3;display:flex;align-items:center;gap:.3em}
.timer svg{width:.9em;height:.9em}
.timer.run{background:#e6f6ee}
.timer.done{background:var(--yellow);animation:pulse .8s 3}
.road{position:relative;width:100%;height:clamp(64px,11vmin,110px);flex:none;background:#58546a;border-radius:20px;overflow:visible;cursor:pointer;margin-top:clamp(20px,4vmin,44px)}
.road:before{content:"";position:absolute;left:16px;right:16px;top:50%;border-top:5px dashed #ffe07a;transform:translateY(-50%)}
.road .rbus{position:absolute;left:8px;bottom:18%;width:clamp(70px,12vmin,130px);transform:scaleX(-1);transition:left .25s linear;z-index:2}
.rsign{position:absolute;right:10px;bottom:12%;display:flex;flex-direction:column;align-items:center;z-index:1}
.rsign b{background:var(--red);color:#fff;border:4px solid #fff;outline:3px solid var(--ink);border-radius:14px;font-size:clamp(14px,2.4vmin,26px);line-height:1.1;padding:.15em .45em;font-weight:900;text-align:center;white-space:nowrap}
.rsign b span{display:block;font-size:1.35em;font-variant-numeric:tabular-nums}
.rsign i{display:block;width:8px;height:clamp(14px,3vmin,30px);background:var(--ink);border-radius:4px}
.road.done .rsign b{animation:pulse .8s 3}
.busstop{position:absolute;inset:0;z-index:20;background:linear-gradient(#bfe9ff 60%,#58546a 60%);display:flex;align-items:flex-end;overflow:hidden;animation:fadeIn .3s}
.busstop .bigbus{position:absolute;bottom:14%;width:min(44vh,40vw);left:3vw;transform:scaleX(-1);transition:left 2.6s cubic-bezier(.2,.7,.3,1)}
.busstop .sign{position:absolute;right:4vw;bottom:14%;display:flex;flex-direction:column;align-items:center}
.busstop .sign b{display:block;background:var(--red);color:#fff;border:8px solid #fff;outline:6px solid var(--ink);border-radius:28px;font-size:clamp(40px,9vmin,110px);padding:.05em .35em;font-weight:900;white-space:nowrap;animation:stamp .5s 2.6s both}
.busstop .sign i{display:block;width:16px;height:min(26vh,22vw);background:var(--ink);border-radius:8px}
@media (max-width:600px){.busstop .sign b{white-space:normal;width:min-content;text-align:center;line-height:1.05}.busstop .bigbus{width:34vw}}

/* ---------- O show me ---------- */
.show6{flex:1;min-height:0;width:min(96vw,150vh);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:2vmin}
.show6 .wcard{position:relative}
.show6 .num{position:absolute;top:8px;left:12px;width:clamp(44px,9vmin,100px);height:clamp(44px,9vmin,100px);border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(30px,7vmin,76px);box-shadow:0 5px 0 var(--purple-d)}
.show6 .wcard .w{visibility:hidden}
.show6 .wcard.hit{box-shadow:0 0 0 8px var(--green),0 8px 0 #eedfc3;animation:bounceBig .7s}
.show6 .wcard.hit .w{visibility:visible}
.thumbs3{display:flex;gap:6vmin}
.thumbs3 div{width:clamp(90px,18vmin,200px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.thumbs3 svg{width:70%;height:70%}

/* ---------- P memory ---------- */
.teams{display:flex;gap:3vmin;align-items:center;flex:none}
.team{font-weight:900;font-size:clamp(22px,4vmin,44px);padding:.15em .8em;border-radius:999px;background:#fff;box-shadow:0 5px 0 #eedfc3;opacity:.55;transition:all .25s}
.team.red{color:#e03a4b}.team.blue{color:#2f6fed}
.team.on{opacity:1;transform:scale(1.12)}
.team.red.on{background:#ffe3e6;box-shadow:0 0 0 5px #e03a4b}
.team.blue.on{background:#e0ebff;box-shadow:0 0 0 5px #2f6fed}
.mgrid{flex:1;min-height:0;width:min(96vw,140vh);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:1.6vmin;perspective:1200px}
.mcard{border:0;padding:0;background:none;position:relative;min-height:0}
.mcard .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.mcard .back{background:var(--purple);background-image:radial-gradient(circle,#8f78ff 0 18%,transparent 19%);background-size:34px 34px;color:#fff;font-size:clamp(40px,8vmin,90px);font-weight:900}
.mcard .front{background:#fff;transform:rotateY(180deg);padding:6%}
.mcard .front .pic{width:100%;height:100%}
.mcard .front .w{font-weight:900;font-size:clamp(26px,5.6vmin,64px)}
.mcard.red .front{box-shadow:0 0 0 6px #e03a4b}
.mcard.blue .front{box-shadow:0 0 0 6px #2f6fed}
.mcard.pend .front{box-shadow:0 0 0 6px var(--yellow);animation:pulse .9s infinite}
.confirm{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;display:flex;gap:14px;align-items:center;background:#fff;border-radius:999px;padding:8px 10px 8px 24px;box-shadow:0 6px 0 #eedfc3;font-weight:900;font-size:clamp(22px,4vmin,40px);animation:popIn .3s}
.confirm button{border:0;border-radius:999px;width:1.9em;height:1.9em;display:grid;place-items:center;font-weight:900}
.confirm svg{width:60%;height:60%}
.confirm .y{background:var(--green)}.confirm .n{background:#e9edf5}

/* ---------- animations ---------- */
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;transform:scale(.8)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes bounceBig{0%{transform:scale(1)}25%{transform:scale(1.12,.9) translateY(4%)}50%{transform:scale(.95,1.08) translateY(-8%)}75%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes rise{from{top:100%}to{top:-60%}}
@keyframes sway{from{transform:translateX(-12%) rotate(-5deg)}to{transform:translateX(12%) rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes spinPop{0%{transform:scale(0) rotate(-120deg)}100%{transform:scale(1) rotate(0)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(8deg);opacity:0}100%{transform:scale(1) rotate(8deg);opacity:1}}
@keyframes burst{0%{transform:scale(.6)}50%{transform:scale(1.5) rotate(40deg)}100%{transform:scale(2) rotate(90deg);opacity:0}}
@keyframes fallAway{to{transform:translateY(60vh) rotate(40deg);opacity:0}}
@keyframes spinBall{to{transform:rotate(360deg)}}
@keyframes hop{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-22px) rotate(8deg)}}

/* ---------- phone ---------- */
@media (max-width:700px){
  #top{gap:8px;padding:0 8px}
  .chip,#stMin,#soundBtn,#keys{display:none}
  .tb-right{gap:6px}
  #screen{padding:10px 8px 14px}
  .side{top:auto;bottom:12px;transform:none}
  .side:active{transform:translateY(3px)}
  .cards6,.show6{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
  .bank{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,minmax(0,1fr));max-height:none}
  .frame{font-size:40px;border-width:5px;margin-top:44px}
  .bub{font-size:24px}
  .he{font-size:17px;border-radius:22px}
  .mgrid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}
  .itsa{flex-direction:column;gap:3vh}
  .itsa .pic{height:min(30vh,60vw)}
  .bubble{min-width:70vw}
  .bubbles{align-items:center}
  .letters{flex-direction:column}
  .letters .lbox{height:min(32vh,70vw)}
  .gest{top:8px;left:8px}
  .meet{width:100%}
  .parts button{padding:.35em .7em}
  .parts small{display:none}
}
</style>
</head>
<body>
<header id="top">
  <button class="ib" id="menuBtn" aria-label="All stages" title="All stages (M)"></button>
  <div id="stageTitle"><span id="stNum">1</span><span id="stName"></span><span id="stMin" class="chip"></span><span id="stMode" class="chip"></span></div>
  <div class="tb-right">
    <button class="ib" id="prevBtn" aria-label="Previous stage" title="Previous stage"></button>
    <button class="ib" id="nextBtn" aria-label="Next stage" title="Next stage"></button>
    <button class="ib" id="soundBtn" aria-label="Test sound" title="Test sound"></button>
    <button class="ib" id="fsBtn" aria-label="Full screen" title="Full screen (F)"></button>
  </div>
</header>
<nav id="progress" aria-label="Stages"></nav>
<main id="screen"></main>
<div id="keys"></div>
<div id="menu" hidden>
  <div class="menu-card">
    <div class="menu-head"><h2>The letter <span class="b">B b</span> · <span id="totalMin"></span> min</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn green" id="testSound"></button><button class="btn" id="closeMenu">Close</button></div></div>
    <div class="menu-grid" id="menuGrid"></div>
    <div class="menu-keys" id="menuKeys"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

  }
};

// Every line the site can say. tools/clips.mjs records one clip per line into CLIPS below.
const PHRASES = L => {
  const w = L.words.map(x => x.id), t = L.text;

    ...w.map(x => t.popTarget + x + "!"), ...w.map(x => `It's a ${x}.`), "It's", "a",
    t.todaySay, t.catchSay, t.whatIsIt, t.letterSay, t.showFinal, t.bye, t.soundTest
  ])];
};

/* ---------- confetti ---------- */
const CV = $("#confetti"), CX = CV.getContext("2d");
let PARTS = [], CRUN = false;
const CCOL = ["#ff5fa2", "#7357ff", "#ffd23f", "#22b573", "#2f80ed", "#ff9f43", "#e8202a"];
function confetti(x = innerWidth / 2, y = innerHeight * .35, n = 150) {
  CV.width = innerWidth; CV.height = innerHeight;
  for (let i = 0; i < n; i++) PARTS.push({ x, y, vx: (Math.random() - .5) * 18, vy: -Math.random() * 15 - 4, s: 7 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: CCOL[i % CCOL.length], life: 80 + Math.random() * 60 });
  if (!CRUN) { CRUN = true; requestAnimationFrame(ctick); }
}
function ctick() {
  CX.clearRect(0, 0, CV.width, CV.height);
  PARTS = PARTS.filter(p => p.life-- > 0 && p.y < CV.height + 30);
  for (const p of PARTS) {
    p.vy += .42; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    CX.save(); CX.translate(p.x, p.y); CX.rotate(p.r); CX.fillStyle = p.c; CX.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); CX.restore();
  }
  if (PARTS.length) requestAnimationFrame(ctick); else { CRUN = false; CX.clearRect(0, 0, CV.width, CV.height); }
}
const confettiAt = el => { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 80); };
function celebrate(root, title, sub = "") {
  const d = document.createElement("div");
  d.className = "win";
  d.innerHTML = `<div class="win-card"><div class="win-stars">${ICON.star}${ICON.star}${ICON.star}</div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>`;
  root.appendChild(d); confetti(); SFX.cheer();
  root.dataset.state = "won";
  return d;
}

/* ---------- per-stage scope: timers die when the stage changes ---------- */
function makeScope() {
  const ts = new Set(); let alive = true;
  return {
    get alive() { return alive; },
    after(ms, fn) { const t = setTimeout(() => { ts.delete(t); if (alive) fn(); }, ms * SPEED); ts.add(t); return t; },
    clear(t) { clearTimeout(t); ts.delete(t); },
    frame(fn) { const loop = t => { if (alive && fn(t) !== false) requestAnimationFrame(loop); }; requestAnimationFrame(loop); },
    stop() { alive = false; ts.forEach(clearTimeout); ts.clear(); }
  };
}
function sideArrows(el, prev, next) {
  const l = document.createElement("button"), r = document.createElement("button");
  l.className = "side l"; r.className = "side r"; l.innerHTML = ICON.prev; r.innerHTML = ICON.next;
  l.setAttribute("aria-label", "Previous"); r.setAttribute("aria-label", "Next");
  l.onclick = () => prev() === false && prevStage(); r.onclick = () => next() === false && nextStage(); el.append(l, r);
}
const dotsHTML = (n, i, okUpTo = -1) => Array.from({ length: n }, (_, k) => `<i class="${k === i ? "on" : ""} ${k < okUpTo ? "ok" : ""}"></i>`).join("");

/* F. Catch the B! */
GAMES.catch = (el, sc) => {
  let state = "ready", count = 0, speed = "slow", t0 = 0, last = null, acc = 0, lane = -1, items = [];
  const palette = ["#7357ff", "#ff5fa2", "#22b573", "#2f80ed", "#ff9f43", "#e8202a"];
  el.innerHTML = `<div class="catch-hud"><div class="stars"><span class="star-ic">${ICON.star}</span><b class="cnt">0</b></div><div class="tbar"><i></i></div><button class="pill speed"></button></div><div class="field"></div>`;
  const field = $(".field", el), bar = $(".tbar i", el), cnt = $(".cnt", el), spd = $(".speed", el);
  const SPEEDS = Object.keys(S.catchSpeeds);
  const setSpeed = () => { spd.textContent = "Speed: " + speed; el.dataset.speed = speed; };
  spd.onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; setSpeed(); };
  setSpeed();
  const ready = (html) => {
    field.innerHTML = `<div class="ready">${html}<button class="btn go">${ICON.play} Go!</button></div>`;
    $(".go", field).onclick = start;
  };
  ready(`<div class="big"><span class="b">B</span> <span class="b">b</span></div><h1 class="title">Catch the B!</h1>`);
  function start() {
    if (state === "running") return;
    field.innerHTML = ""; items = []; count = 0; cnt.textContent = 0; el.dataset.count = 0;
    state = "running"; el.dataset.state = "running"; t0 = performance.now(); last = null; acc = 1e9;
    sc.frame(loop);
  }
  function spawn(fw) {
    const ok = Math.random() < S.catchBShare, ch = ok ? pick(["B", "b"]) : pick(S.catchOthers);
    const b = document.createElement("button"); b.className = "letter"; b.dataset.ok = ok ? "1" : ""; b.dataset.ch = ch;
    b.innerHTML = `<div class="lt" style="color:${palette[Math.random() * palette.length | 0]}">${ch}</div>`;
    field.appendChild(b);
    const size = b.offsetWidth, lanes = Math.max(3, Math.floor(fw / (size * 1.1)));
    let l; do { l = Math.random() * lanes | 0; } while (l === lane && lanes > 1); lane = l;
    const it = { b, ok, y: -size, x: l * (fw - size) / (lanes - 1 || 1), done: false };
    b.style.transform = `translate(${it.x}px,${it.y}px)`;
    b.addEventListener("pointerdown", e => { e.preventDefault(); hit(it); });
    items.push(it);
  }
  function hit(it) {
    if (it.done || state !== "running") return; it.done = true;
    if (it.ok) {
      it.b.classList.add("burst"); $(".lt", it.b).innerHTML = ICON.star; SFX.sparkle(); speak(T.catchSay);
      count++; cnt.textContent = count; restart(cnt, "bump"); el.dataset.count = count;

    sc.after(1400, () => it.b.remove());
  }

    const R = S.catchSeconds * 1000 * SPEED, el2 = ts - t0;
    bar.style.width = Math.max(0, 100 * (1 - el2 / R)) + "%";
    if (el2 >= R) { end(); return false; }
    const fw = field.clientWidth, fh = field.clientHeight, sp = S.catchSpeeds[speed], fall = sp.fall;
    acc += dt; if (acc >= sp.every * SPEED) { acc = 0; spawn(fw); }
    for (const it of items) {

      it.y += fh / fall * dt / 1000;
      it.b.style.transform = `translate(${it.x}px,${it.y}px)`;
      if (it.y > fh - it.b.offsetHeight * .6) { it.done = true; it.b.classList.add("fade"); sc.after(600, () => it.b.remove()); }
    }
  }
  function end() {
    state = "done"; el.dataset.state = "done"; items.forEach(it => it.b.remove()); items = [];
    ready(`<h1 class="title">You caught ${count} B${count === 1 ? "" : "s"}!</h1><div class="win-stars">${ICON.star}${ICON.star}${ICON.star}</div>`);
    confetti(); SFX.cheer();
  }
  return { keys: "Space: start round · S: slow / medium / fast", onKey(k) { if (k === " " || k === "Enter") return start(), true; if (k === "s" || k === "S") return spd.onclick(), true; } };
};

/* G. Build the word: spell the whole word from scrambled letter tiles */
GAMES.build = (el, sc) => {
  let order, r, need, solved;
  const start = () => {
    const ws = S.buildWords;
    order = [...shuffle(ws.slice(0, S.buildEasy)), ...ws.slice(S.buildEasy)]; r = 0; $(".win", el)?.remove(); round();
  };
  function round() {
    solved = false; need = 0; const w = order[r]; el.dataset.word = w; el.dataset.state = "";
    const tiles = shuffle([...w, pick(S.buildDistractors)]);
    el.innerHTML = `<div class="build">${pic(w, "pop-in")}
      <div class="bword" style="--n:${w.length}">${[...w].map((_, k) => `<div class="slot${k ? "" : " first"}"></div>`).join("")}</div>
      <div class="tiles">${tiles.map(l => `<button class="tile" data-letter="${l}">${l}</button>`).join("")}</div>
      <div class="bfoot"><div class="dots">${dotsHTML(order.length, r, r)}</div><button class="btn green nextbtn">Next ${ICON.next.replace(O, "#fff").replace(O, "#fff")}</button></div></div>${heLine(H.build)}`;
    $(".nextbtn", el).onclick = forward;
    $(".build .pic", el).onclick = () => speak(w);
    $$(".tile", el).forEach(drag);
    mark();
    sc.after(350, () => speak(w));
  }
  const mark = () => $$(".slot", el).forEach((s, k) => s.classList.toggle("next", k === need));
  function drag(tile) {
    tile.addEventListener("pointerdown", e => {
      if (solved || tile.dataset.busy) return; e.preventDefault();
      try { tile.setPointerCapture(e.pointerId); } catch (_) {}
      const sx = e.clientX, sy = e.clientY; let moved = false; tile._dx = 0; tile._dy = 0;
      tile.classList.add("drag"); tile.style.transition = "none";
      const mv = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy; if (Math.hypot(dx, dy) > 8) moved = true; tile._dx = dx; tile._dy = dy; tile.style.transform = `translate(${dx}px,${dy}px) scale(1.08)`; };

/* timer helper for M and N */
function countdown(sc, seconds, onTick, onEnd) {
  let left = seconds * 1000, running = false, last = null, ended = false;
  const api = {
    get running() { return running; }, get ended() { return ended; }, get left() { return left; },
    toggle() { if (ended) return; running = !running; last = null; if (running) sc.frame(loop); },
    reset() { running = false; ended = false; left = seconds * 1000; onTick(left, 0); }
  };
  function loop(ts) {
    if (!running) return false;
    if (last !== null) left -= (ts - last) / SPEED; last = ts;
    if (left <= 0) { left = 0; running = false; ended = true; onTick(0, 1); onEnd(); return false; }
    onTick(left, 1 - left / (seconds * 1000));
  }
  onTick(left, 0);
  return api;
}
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${s / 60 | 0}:${String(s % 60).padStart(2, "0")}`; };

  const start = () => {
    team = 0; score = [0, 0]; up = []; lock = false; pend = null; matched = 0; el.dataset.state = "";
    const cards = shuffle(WIDS.flatMap(w => [{ w, k: "pic" }, { w, k: "word" }]));

    } else {

else $("#soundBtn").onclick = testSound;

$("#progress").innerHTML = STAGES.map((s, k) => `<button class="${isOff(s) ? "off" : ""} ${s.bonus ? "bonus" : ""}" title="${stageLabel(k)}. ${s.name}" aria-label="Stage ${stageLabel(k)}"></button>`).join("");
$$("#progress button").forEach((b, k) => b.onclick = () => go(k));
$("#menuGrid").innerHTML = STAGES.map((s, k) => `<button class="mstage ${isOff(s) ? "off" : ""} ${s.bonus ? "bonus" : ""}"><span class="n">${stageLabel(k)}</span><span><b>${s.name}</b><small>${s.bonus ? "only if time is left" : s.min + " min"} · ${s.mode.toLowerCase()}</small></span></button>`).join("");
$$(".mstage").forEach((b, k) => b.onclick = () => { closeMenu(); go(k); });
const total = STAGES.reduce((t, s) => t + s.min, 0), bonusAt = STAGES.findIndex(s => s.bonus) + 1;
$("#totalMin").textContent = total; document.title = `${LESSON.title} – English, 3rd grade (${total} min)`;
$("#menuKeys").innerHTML = `<span class="kbd">F</span> full screen · <span class="kbd">1</span>–<span class="kbd">${STAGES.length}</span> jump to a stage${bonusAt ? ` (${bonusAt} = bonus)` : ""} · <span class="kbd">←</span> <span class="kbd">→</span> next / previous item, then stage · <span class="kbd">Space</span> reveal / play · <span class="kbd">Enter</span> answer · <span class="kbd">R</span> say again · <span class="kbd">M</span> this menu`;
const menuEl = $("#menu");
const openMenu = () => { menuEl.hidden = false; }, closeMenu = () => { menuEl.hidden = true; };
$("#menuBtn").onclick = () => menuEl.hidden ? openMenu() : closeMenu();
$("#closeMenu").onclick = closeMenu;
menuEl.onclick = e => { if (e.target === menuEl) closeMenu(); };

// keyboard
let dbuf = "", dtimer = null;
function digit(d) {
  clearTimeout(dtimer);
  if (dbuf === "" && d !== "1") { if (d !== "0") { closeMenu(); go(+d - 1); } return; }
  dbuf += d;
  if (dbuf.length === 2) { const n = +dbuf; dbuf = ""; if (n >= 1 && n <= STAGES.length) { closeMenu(); go(n - 1); } return; }
  dtimer = setTimeout(() => { dbuf = ""; closeMenu(); go(0); }, 700);
}
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key; ac();
  if ([" ", "Enter", "Backspace", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(k)) e.preventDefault();
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  if (k === "f" || k === "F") return toggleFS();
  if (k === "m" || k === "M") return menuEl.hidden ? openMenu() : closeMenu();
  if (k === "Escape") return closeMenu();
  if (/^[0-9]$/.test(k)) { if (dbuf === "" && menuEl.hidden && ctrl.onDigit && ctrl.onDigit(+k)) return; return digit(k); }
  if (!menuEl.hidden) return;
  if (ctrl.onKey && ctrl.onKey(k, e)) return;
  // arrows always work: a game moves through its items, past the ends (or with none) the stage changes
  if (k === "ArrowRight") return nextStage();
  if (k === "ArrowLeft") return prevStage();
  if ((k === "r" || k === "R") && lastSpoken) speak(lastSpoken);
});
addEventListener("pointerdown", () => ac(), { once: true });
addEventListener("resize", () => { CV.width = innerWidth; CV.height = innerHeight; });

// start (the address keeps the stage, so a reload stays put)
{ const m = /^#(\d+)(?:\.(\d+))?/.exec(location.hash); go(m ? +m[1] - 1 : 0, m && m[2] ? +m[2] - 1 : 0); }
</script>
